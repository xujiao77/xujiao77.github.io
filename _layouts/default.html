<!doctype html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace }}">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="brand-mark">✦</span> {{ site.title | split: '·' | first }}</a>
      <nav aria-label="主导航">
        <ul class="nav-links">
          <li><a href="{{ '/' | relative_url }}#writing">文章</a></li>
          <li><a href="{{ '/' | relative_url }}#projects">项目</a></li>
          <li><a href="{{ '/about.html' | relative_url }}">关于我</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer"><div class="wrap footer-row"><span>© {{ 'now' | date: '%Y' }} {{ site.title | split: '·' | first }}</span><span><a href="https://github.com/xujiao77">GitHub</a> · <a href="{{ '/about.html' | relative_url }}">关于我</a></span></div></footer>
</body>
</html>
